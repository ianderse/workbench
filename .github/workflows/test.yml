name: test

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'resources/**'
      - '.github/scripts/**'
      - 'electron.vite.config.ts'
      - 'vitest.config.ts'
      - 'package*.json'
      - 'tsconfig*.json'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'resources/**'
      - '.github/scripts/**'
      - 'electron.vite.config.ts'
      - 'vitest.config.ts'
      - 'package*.json'
      - 'tsconfig*.json'
      - '.github/workflows/test.yml'

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      # The first platform to fail cancels the others (its steps already stop at the first
      # failing one), so a broken change doesn't keep the remaining runners busy
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check and run tests
        run: npm test

      - name: Build application
        run: npm run build
