name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # This job's `if` guards the workflow: upload needs it, so a pre-release skips both
  build:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # macos-15-intel is the last Intel runner, supported until Fall 2027
          - { os: macos-15-intel, script: 'package:mac', arch: '--x64', artifact: mac-x64 }
          - { os: macos-15, script: 'package:mac', arch: '--arm64', artifact: mac-arm64 }
          - { os: windows-latest, script: 'package:win', arch: '', artifact: windows }
          - { os: ubuntu-latest, script: 'package:linux', arch: '', artifact: linux }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Package
        shell: bash
        # The release tag carries the version; package.json only holds the base version
        run: npm run ${{ matrix.script }} -- ${{ matrix.arch }} --publish never --config.extraMetadata.version="${TAG#v}"
        env:
          TAG: ${{ github.event.release.tag_name }}
          # This repo holds no signing certificates, so build unsigned rather than
          # letting electron-builder hunt for an identity
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: ignore
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.deb
            dist/latest*.yml

  upload:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Collect the assets
        run: |
          mkdir -p assets
          # Every file but latest-mac.yml is unique to one platform
          find artifacts -type f ! -name latest-mac.yml -exec cp {} assets/ \;

          # electron-updater only ever fetches latest-mac.yml, so the Intel and Apple Silicon
          # builds have to share one, or an update offers the other architecture's download
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          python3 -c '
          import pathlib, yaml
          # Intel first: the top-level path it leaves behind is the legacy fallback, and an
          # x64 build runs on both architectures
          manifests = sorted(pathlib.Path("artifacts").rglob("latest-mac.yml"), key=lambda p: "x64" not in p.parent.name)
          merged = yaml.safe_load(manifests[0].read_text())
          for extra in manifests[1:]:
              merged["files"] += yaml.safe_load(extra.read_text())["files"]
          pathlib.Path("assets/latest-mac.yml").write_text(yaml.safe_dump(merged, sort_keys=False))
          '
          ls -l assets

      - name: Upload to the release
        run: gh release upload "$TAG" assets/* --clobber --repo "$GITHUB_REPOSITORY"
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
